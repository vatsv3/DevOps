name: CI / Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least-privilege defaults; the deploy job elevates as needed.
permissions:
  contents: read

# Allow only one in-flight Pages deploy at a time, but let it finish
# so a running deploy is not cancelled mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Continuous Integration: runs on every push and PR to main.
  # Proves the site can be built from a clean checkout.
  ci:
    name: Build (CI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Upload build artifact for deploy job
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  # Continuous Deployment: only runs for pushes to main, after CI passes.
  deploy:
    name: Deploy to GitHub Pages (CD)
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
